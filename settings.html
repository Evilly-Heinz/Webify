<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopify Project Manager - Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Shopify Project Manager</h1>
      <p class="subtitle">Manage your Shopify projects</p>
    </div>

    <div class="content">
      <div class="section">
        <h2>Add New Project</h2>
        <form id="projectForm" class="project-form">
          <div class="form-group">
            <label for="projectName">Project Name *</label>
            <input type="text" id="projectName" name="name" required placeholder="My Shopify Store">
          </div>

          <div class="form-group">
            <label for="storeName">Store Name *</label>
            <input type="text" id="storeName" name="storeName" required placeholder="mystore">
            <small>Enter the store name without .myshopify.com (e.g., "mystore" for mystore.myshopify.com)</small>
          </div>

          <div class="form-group">
            <label for="devThemeId">Dev Theme ID</label>
            <input type="text" id="devThemeId" name="devThemeId" placeholder="123456789">
            <small>Optional: Development theme ID for preview</small>
          </div>

          <div class="form-group">
            <label for="liveThemeId">Live Theme ID</label>
            <input type="text" id="liveThemeId" name="liveThemeId" placeholder="987654321">
            <small>Optional: Live theme ID for viewing</small>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Project</button>
            <button type="reset" class="btn btn-secondary">Clear</button>
          </div>
        </form>
      </div>

      <div class="section">
        <h2>Saved Projects</h2>
        <div id="projectsList" class="projects-list">
          <div class="empty-state">No projects added yet.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="settings.js"></script>
</body>
</html>
