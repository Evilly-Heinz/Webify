<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopify Projects</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Shopify Projects</h1>
      <div class="header-actions">
        <button id="liquidDocsBtn" class="header-icon-btn" title="Liquid Documentation">
          📄
        </button>
        <button id="storefrontApiBtn" class="header-icon-btn" title="Storefront API Documentation">
          🔌
        </button>
        <button id="settingsBtn" class="header-icon-btn" title="Open Settings">
          ⚙️
        </button>
      </div>
    </div>
    
    <div id="projectsList" class="projects-list">
      <div class="empty-state">
        <p>No projects added yet.</p>
        <button id="addProjectBtn" class="add-btn">Add Project</button>
      </div>
    </div>
    
    <div class="footer">
      <button id="addBtn" class="add-btn-primary">+ Add Project</button>
    </div>
  </div>
  
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
